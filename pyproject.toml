# Deployment manifest for the STENTOR API on Vercel (the app itself lives in services/api).
[project]
name = "stentor-deploy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[tool.vercel]
entrypoint = "app:app"
